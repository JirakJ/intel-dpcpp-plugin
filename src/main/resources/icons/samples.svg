<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Code samples icon -->
  <rect x="1" y="2" width="14" height="12" rx="1.5" fill="none" stroke="#0071C5" stroke-width="1.5"/>
  <line x1="1" y1="5" x2="15" y2="5" stroke="#0071C5" stroke-width="1.5"/>
  
  <!-- Code brackets -->
  <g fill="none" stroke="#00C7FD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 8 L 3 9.5 L 4 11"/>
    <path d="M 12 8 L 13 9.5 L 12 11"/>
    <line x1="7" y1="7.5" x2="9" y2="11.5"/>
  </g>
  
  <!-- Window dots -->
  <g fill="#0071C5">
    <circle cx="3" cy="3.5" r="0.7"/>
    <circle cx="5" cy="3.5" r="0.7"/>
    <circle cx="7" cy="3.5" r="0.7"/>
  </g>
</svg>
